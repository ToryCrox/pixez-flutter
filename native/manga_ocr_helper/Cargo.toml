[package]
name = "manga-ocr-helper"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
libc = "0.2"
ort = { version = "=2.0.0-rc.12", features = ["copy-dylibs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true
